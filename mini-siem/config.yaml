# Mini SIEM configuration
db_path: data/siem.db
log_year: null            # syslog has no year; null = current year

# URL paths treated as "login endpoints" in web access logs
login_paths:
  - /login
  - /wp-login.php
  - /admin
  - /xmlrpc.php

detection:
  window_minutes: 5               # sliding window size
  brute_force_threshold: 10       # failed logins from ONE ip inside the window
  spraying_unique_users: 8        # ONE ip trying this many different usernames
  distributed_unique_ips: 8       # ONE username attacked from this many different ips
  success_after_fail_threshold: 5 # N fails then a success from same ip = possible compromise
